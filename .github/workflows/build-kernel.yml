name: Build Kernel with GCC (Stable)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  DEFCONFIG: "vendor/xiaomi/mi8998_defconfig"
  ARCH: "arm64"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ccache automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 \
            libbz2-dev libbz2-1.0 liblz4-tool libssl-dev bc \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip \
            device-tree-compiler python3

      - name: 下载 GCC 工具链（arm32 + arm64）
        run: |
          mkdir -p toolchain
          # 32位 ARM 工具链（用于编译内核中的32位组件）
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain/arm32
          # 64位 ARM 工具链
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain/arm64

      - name: 设置环境变量
        run: |
          echo "CROSS_COMPILE=$PWD/toolchain/arm64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=$PWD/toolchain/arm32/bin/arm-linux-androideabi-" >> $GITHUB_ENV
          echo "PATH=$PWD/toolchain/arm64/bin:$PWD/toolchain/arm32/bin:$PATH" >> $GITHUB_ENV
          # 使用 ccache 加速
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 编译内核
        run: |
          export KBUILD_BUILD_USER="GitHubCI"
          export KBUILD_BUILD_HOST="Actions"
          make O=out ARCH=arm64 ${DEFCONFIG}
          make -j$(nproc --all) O=out ARCH=arm64 \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32}

      - name: 准备 AnyKernel3
        run: |
          if [ ! -d "AnyKernel3" ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          # 如果需要 dtbo 或单独 dtb，取消对应注释
          # cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          # cp out/arch/arm64/boot/dts/*.dtb AnyKernel3/dtb/

      - name: 打包卡刷包
        run: |
          cd AnyKernel3
          zip -r9 ../Kernel-$(date +%Y%m%d-%H%M)-CI.zip * -x .git README.md *placeholder
          cd ..

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-GCC-ZIP
          path: Kernel-*.zip
