name: Build Kernel and AnyKernel3 ZIP

on:
  workflow_dispatch:      # 允许手动触发
  push:
    branches: [ main ]   # 推送自动编译，可改为你的分支

env:
  DEFCONFIG: "vendor/xiaomi/mi8998_defconfig"   # 你的设备内核配置文件
  ARCH: "arm64"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ccache automake flex lzop bison gperf build-essential \
            zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 \
            libbz2-dev libbz2-1.0 liblz4-tool libssl-dev bc \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip \
            device-tree-compiler python3

      - name: 设置 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.DEFCONFIG }}-

      - name: 安装 Clang 14 和 LLVM 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 lld-14 llvm-14
          # 将 LLVM 14 的工具设置为默认
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-14 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-14 100
          # 添加 LLVM 14 的 bin 目录到 PATH，并设置关键环境变量
          echo "PATH=/usr/lib/llvm-14/bin:$PATH" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: 编译内核
        run: |
          export KBUILD_BUILD_USER="GitHubCI"
          export KBUILD_BUILD_HOST="Actions"
          make O=out ARCH=arm64 ${DEFCONFIG}
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-asm-operand-widths" \
            LLVM_IAS=1

      - name: 准备 AnyKernel3 目录
        run: |
          if [ ! -d "AnyKernel3" ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi
          # 复制编译好的内核镜像到 AnyKernel3 目录
          # 常见输出：Image.gz-dtb，如果不是请修改
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          # 如果你的设备需要单独 dtb/dtbo，取消下面的注释
          # cp out/arch/arm64/boot/dts/*.dtb AnyKernel3/dtb/
          # cp out/arch/arm64/boot/dtbo.img AnyKernel3/

      - name: 打包成卡刷包
        run: |
          cd AnyKernel3
          # 可选：修改设备检查，防止刷错
          # sed -i "s/device.name1=.*/device.name1=你的设备代号/" anykernel.sh
          zip -r9 ../Kernel-$(date +%Y%m%d-%H%M)-CI.zip * -x .git README.md *placeholder
          cd ..

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-ZIP
          path: Kernel-*.zip
